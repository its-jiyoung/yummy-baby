<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f7f2">
<title>이유식 식단 캘린더</title>
<style>
:root{--bg:#f7f7f2;--card:#fff;--ink:#202722;--muted:#89928b;--line:#e8ece6;--sage:#e5f1e8;--sage2:#6d9d79;--sage3:#4d7859;--yellow:#fff0b9;--yellow2:#e1c45a;--shadow:0 12px 38px rgba(45,56,47,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans KR",sans-serif;letter-spacing:-.025em}
.app{max-width:1180px;margin:auto;padding:12px 14px calc(92px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 17px;border-radius:27px;background:#fff;border:1px solid #fff;box-shadow:var(--shadow);position:sticky;top:10px;z-index:20;backdrop-filter:blur(16px)}
.baby{display:flex;align-items:center;gap:11px}.baby .name{font-size:18px;font-weight:950;line-height:1.2}.baby .sub{font-size:12px;color:#6f7c73;font-weight:750;margin-top:4px}.avatar{width:46px;height:46px;border-radius:17px;background:#edf3ee;display:grid;place-items:center;font-size:24px}.today-badge{padding:9px 12px;border-radius:999px;background:#edf6ef;color:var(--sage3);font-size:12px;font-weight:950}.actions{display:flex;gap:7px}.icon{width:38px;height:38px;border:0;border-radius:13px;background:#fff;box-shadow:0 4px 13px rgba(40,50,43,.06)}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 10px}.month{font-size:22px;font-weight:950}.nav{display:flex;gap:6px}.nav button,.today{border:0;background:#fff;border-radius:12px;padding:9px 12px;font-weight:850;box-shadow:0 3px 12px rgba(40,50,43,.05)}.nav button{width:35px;padding:0;font-size:19px}
.calendar-wrap{background:#fff;border:1px solid var(--line);border-radius:27px;box-shadow:var(--shadow);overflow:hidden}.calendar-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.calendar{min-width:920px}
.week{display:grid;grid-template-columns:repeat(7,1fr);background:#fafbf8;border-bottom:1px solid var(--line)}.week div{text-align:center;padding:11px 6px;font-size:11px;color:#929a94;font-weight:850}.week div:first-child{color:#c27c74}.week div:last-child{color:#7892a2}
.days{display:grid;grid-template-columns:repeat(7,1fr)}.day{min-height:255px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px;background:#fff;cursor:pointer;vertical-align:top}.day:nth-child(7n){border-right:0}.day.muted{background:#fafbf9;opacity:.48}.day.selected{background:#f8fbf8}.day.today{box-shadow:inset 0 3px 0 var(--sage2)}
.date-row{display:flex;justify-content:space-between;align-items:flex-start}.date{font-size:14px;font-weight:950}.dplus{font-size:9px;color:#9aa29c;margin-top:2px}.meal-count{font-size:9px;color:var(--sage3);font-weight:900;background:var(--sage);padding:4px 6px;border-radius:999px}
.meals{display:grid;gap:7px;margin-top:10px}.meal{padding:8px;border-radius:14px;background:#f8faf7;border:1px solid #edf0eb;position:relative}.meal.done{background:#f1f7f2;border-color:#dcebe0}.meal.plan{background:#fffdf5;border-style:dashed;border-color:#eadb9d}
.meal-head{display:flex;justify-content:space-between;align-items:center;padding-right:23px;margin-bottom:5px}.meal-no{font-size:10px;font-weight:950;color:#506057}.time{font-size:8px;color:#9aa19b}.status{position:absolute;right:7px;top:7px;width:18px;height:18px;border:0;border-radius:7px;background:#fff;font-size:10px}.meal.done .status{background:#dfeee4;color:#4f7c5b}.meal.plan .status{background:#fff0b9;color:#856e26}
.base-line{font-size:8.5px;color:#69746c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toppings{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}.chip{font-size:8px;padding:3px 5px;border-radius:6px;background:#e8f2ea;color:#55725d;font-weight:800}.chip.first{background:var(--yellow);color:#6e5b22}.empty-meal{font-size:9px;color:#b0b6b0;padding:4px 0}.add{width:100%;border:1px dashed #cdd7ce;background:#fff;border-radius:10px;padding:6px;color:#7d8d81;font-size:9px;font-weight:850;margin-top:6px}
.legend{display:flex;gap:14px;padding:10px 13px;color:var(--muted);font-size:10px;background:#fbfcfa}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}.dot.plan{background:#eadb9d}.dot.done{background:#b8d9c1}.dot.first{background:#e1c45a}
.side{display:grid;grid-template-columns:1.25fr .75fr;gap:12px;margin-top:12px}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:16px}.panel h2{font-size:16px;margin:0 0 11px}.food-cloud{display:flex;flex-wrap:wrap;gap:7px}.food{padding:8px 10px;border-radius:12px;background:#f3f6f2;font-size:11px;font-weight:800;color:#56635a}.notice{font-size:11px;line-height:1.55;color:#69746c;background:#fff8df;border-radius:14px;padding:10px 12px}.fab{position:fixed;right:max(18px,calc((100vw - 1180px)/2 + 18px));bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;border:0;border-radius:18px;padding:13px 18px;background:#61966d;color:#fff;font-weight:950;box-shadow:0 12px 30px rgba(67,116,79,.24)}
.overlay{display:none;position:fixed;inset:0;background:rgba(28,34,29,.24);backdrop-filter:blur(10px);z-index:50;padding:16px 12px}.overlay.show{display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(650px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:28px 28px 18px 18px;padding:18px;box-shadow:0 20px 60px rgba(30,40,33,.18)}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sheet h2{margin:0;font-size:18px}.close{width:34px;height:34px;border:0;border-radius:11px;background:#f2f4f1}.section{padding:14px 0;border-top:1px solid var(--line)}.section:first-of-type{border-top:0}.label{font-size:11px;font-weight:900;color:#687269;margin-bottom:7px}.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.opt{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 7px;font-size:11px;font-weight:800;color:#56645a}.opt.on{background:#edf7ef;border-color:#b7d7be;color:#4d7958}.input{width:100%;border:1px solid var(--line);background:#fafbf8;border-radius:13px;padding:11px;outline:0}.save{width:100%;border:0;border-radius:14px;padding:13px;background:#659c70;color:#fff;font-weight:950}.secondary{background:#f0f3ef;color:#52705a;margin-top:7px}.danger{background:#fff0ed;color:#c65f55;margin-top:7px}.plan-toggle{display:flex;gap:7px}.toggle{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-size:11px;font-weight:900}.toggle.on{background:#fff5cf;border-color:#eadb9d;color:#7b6729}
.list{display:grid;gap:7px}.row{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-radius:13px;background:#f7f8f5;font-size:11px}.small{font-size:10px;color:var(--muted)}
@media(max-width:700px){.app{padding-left:9px;padding-right:9px}.calendar{min-width:980px}.day{min-height:245px}.side{grid-template-columns:1fr}.today-badge{display:none}}
.auth-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}.auth-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:30px;padding:26px;box-shadow:var(--shadow)}.auth-logo{width:64px;height:64px;border-radius:22px;background:#edf3ee;display:grid;place-items:center;font-size:34px;margin:0 auto 14px}.auth-title{text-align:center;font-size:25px;font-weight:950}.auth-sub{text-align:center;color:#6f7c73;font-size:12px;font-weight:750;margin:7px 0 22px}.auth-tabs{display:flex;gap:6px;background:#f4f6f3;border-radius:14px;padding:4px;margin-bottom:16px}.auth-tab{flex:1;border:0;background:transparent;border-radius:10px;padding:10px;font-weight:900;color:#7b857e}.auth-tab.on{background:#fff;color:#4d7859;box-shadow:0 2px 8px rgba(40,50,43,.06)}.auth-msg{font-size:11px;line-height:1.55;padding:10px 12px;border-radius:13px;background:#fff8df;color:#766329;margin-bottom:12px}.auth-error{background:#fff0ed;color:#a94f47}.auth-success{background:#edf7ef;color:#4d7859}.auth-form{display:grid;gap:9px}.auth-form .input{background:#fafbf8}.auth-actions{display:grid;gap:8px;margin-top:5px}.auth-link{border:0;background:transparent;color:#5f8168;font-size:11px;font-weight:850;padding:7px}.config-note{font-size:10px;color:#8a938c;line-height:1.5;margin-top:12px;text-align:center}.user-pill{font-size:9px;color:#6f7c73;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app" id="app"></div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<button type="button" class="fab" onclick="openAdd()">＋ 식단 추가</button>
<script>
const KEY='baby_food_planner_v4';
const CONFIG_KEY='yummy_supabase_config_v1';
const DEFAULT_SUPABASE_URL='https://izweewdjfewtuddg0mhe.supabase.co';
const DEFAULT_PUBLISHABLE_KEY='PASTE_YOUR_PUBLISHABLE_KEY_HERE';

const defaultState={
  babies:[{id:'baby1',name:'우리 아기',birth:'2026-04-01'}],
  activeBaby:'baby1',
  bases:['쌀','오트밀','현미'],
  toppings:['애호박','청경채','양배추','브로콜리','감자','고구마','단호박','소고기','오이','완두콩','당근','달걀','닭고기','양파','두부','시금치','무','토마토','배추','흰살생선'],
  plans:{}
};

let state=load();
let view=new Date(); view.setDate(1);
let selectedKey=todayKey();
let supabaseClient=null, cloudReady=false, cloudSyncTimer=null, loadingCloud=false, authUser=null;

function getConfig(){
  try{return JSON.parse(localStorage.getItem(CONFIG_KEY)||'null')||{url:DEFAULT_SUPABASE_URL,key:DEFAULT_PUBLISHABLE_KEY}}
  catch(e){return {url:DEFAULT_SUPABASE_URL,key:DEFAULT_PUBLISHABLE_KEY}}
}
function isConfigured(){const c=getConfig();return !!c.url&&!!c.key&&!c.key.includes('PASTE_YOUR')}
function initClient(){if(!isConfigured())return false;const c=getConfig();supabaseClient=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return true}
function getRedirectUrl(){return /^https?:$/.test(location.protocol)?location.origin+location.pathname:undefined}
function load(){try{return {...structuredClone(defaultState),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(defaultState)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));if(cloudReady)queueCloudSync()}
function fmt(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parse(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function todayKey(){return fmt(new Date())}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function dplus(k){const b=state.babies.find(x=>x.id===state.activeBaby)||state.babies[0];return b?.birth?Math.floor((parse(k)-parse(b.birth))/86400000)+1:''}
function meals(k){return state.plans[`${state.activeBaby}_${k}`]||[]}
function setMeals(k,a){const key=`${state.activeBaby}_${k}`;if(a.length)state.plans[key]=a;else delete state.plans[key];save()}

function firstFoods(beforeDate, mealIndex=-1){
  const seen=new Set();
  const prefix=`${state.activeBaby}_`;
  const dates=Object.keys(state.plans)
    .filter(k=>k.startsWith(prefix))
    .map(k=>k.slice(prefix.length))
    .filter(date=>date<beforeDate)
    .sort();

  dates.forEach(date=>{
    (state.plans[`${prefix}${date}`]||[])
      .filter(m=>m.status==='done')
      .forEach(m=>{
        [...(m.bases||[]),...(m.toppings||[])].forEach(x=>{if(x)seen.add(x)})
      });
  });

  // 같은 날짜의 앞선 끼니에서 이미 먹은 음식도 반영
  if(mealIndex>=0){
    (state.plans[`${prefix}${beforeDate}`]||[])
      .slice(0, mealIndex + 1)
      .filter(m=>m.status==='done')
      .forEach(m=>{
        [...(m.bases||[]),...(m.toppings||[])].forEach(x=>{if(x)seen.add(x)})
      });
  }

  return seen;
}

function monthlyFirstFoods(){
  const seenBefore=new Set(), introduced=new Set();
  const month=`${view.getFullYear()}-${String(view.getMonth()+1).padStart(2,'0')}`;
  const dates=Object.keys(state.plans)
    .filter(k=>k.startsWith(state.activeBaby+'_'))
    .map(k=>k.slice(state.activeBaby.length+1))
    .filter(d=>d.startsWith(month))
    .sort();
  dates.forEach(date=>{
    const mealsToday=state.plans[`${state.activeBaby}_${date}`]||[];
    mealsToday.filter(m=>m.status==='done').forEach(m=>{
      [...(m.bases||[]),...(m.toppings||[])].forEach(x=>{
        if(!seenBefore.has(x))introduced.add(x);
      });
    });
    mealsToday.filter(m=>m.status==='done').forEach(m=>{
      [...(m.bases||[]),...(m.toppings||[])].forEach(x=>seenBefore.add(x));
    });
  });
  const prior=firstFoods(dates[0]);
  prior.forEach(x=>introduced.delete(x));
  return introduced;
}
function emoji(x){return '🥗'}

function render(){
  const baby=state.babies.find(x=>x.id===state.activeBaby)||state.babies[0];
  const monthly=monthlyFirstFoods();
  document.getElementById('app').innerHTML=`
<header class="top"><div class="baby"><div class="avatar">👶</div><div><div class="name">${esc(baby?.name||'우리 아기')}의 냠냠 식단</div><div class="sub">냠냠쩝쩝 맛있게 먹어보자 🥣</div></div></div>
<div style="display:flex;align-items:center;gap:8px"><div class="user-pill">${esc(authUser?.email||'')}</div><div class="today-badge">오늘 D+${dplus(todayKey())}</div></div>
<div class="actions"><button type="button" class="icon" onclick="openBabies()">👶</button><button type="button" class="icon" onclick="openSettings()">⚙️</button></div></header>
<div class="toolbar"><button class="today" onclick="goToday()">오늘</button><div class="month">${view.getFullYear()}년 ${view.getMonth()+1}월</div><div class="nav"><button onclick="moveMonth(-1)">‹</button><button onclick="moveMonth(1)">›</button></div></div>
<section class="calendar-wrap"><div class="calendar-scroll"><div class="calendar"><div class="week">${['일','월','화','수','목','금','토'].map(x=>`<div>${x}</div>`).join('')}</div><div class="days">${cells(view).join('')}</div></div></div>
<div class="legend"><span><i class="dot plan"></i> 예정</span><span><i class="dot done"></i> 먹음</span><span><i class="dot first"></i> 처음 먹는 음식</span><span>📱 아이폰에서는 가로로 밀어서 주간 전체 확인</span></div></section>
<div class="side"><section class="panel"><h2>이번 달 처음 먹는 음식</h2><div class="food-cloud">${[...monthly].map(x=>`<span class="food">${emoji(x)} ${esc(x)} ★</span>`).join('')||'<div class="small">아직 실제로 먹은 기록이 없어요.</div>'}</div></section>
<section class="panel"><h2>식단 사용법</h2><div class="notice">메인 캘린더에서 <b>앞으로 먹일 식단을 먼저 계획</b>해두고, 실제로 먹인 뒤 각 끼니의 ○ 버튼을 눌러 완료 처리하세요.<br><br>베이스와 토핑 모두 저장되고, <b>이전 날짜에 실제로 먹은 적이 없는 음식</b>만 처음 먹는 음식으로 표시돼요.</div></section></div>`;
}

function cells(v){
  const y=v.getFullYear(),m=v.getMonth(),start=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),out=[];
  for(let i=0;i<42;i++){
    const n=i-start+1;
    const date=n<=0?new Date(y,m-1,prev+n):n>days?new Date(y,m+1,n-days):new Date(y,m,n);
    const k=fmt(date),cur=date.getMonth()===m,ms=meals(k);
    out.push(`<div class="day ${cur?'':'muted'} ${k===todayKey()?'today':''} ${k===selectedKey?'selected':''}" onclick="selectDay('${k}')">
<div class="date-row"><div><div class="date">${date.getDate()}</div><div class="dplus">D+${dplus(k)}</div></div>${ms.length?`<span class="meal-count">${ms.length}끼</span>`:''}</div>
<div class="meals">${ms.map((x,i)=>mealHTML(x,i,k,firstFoods(k,i))).join('')}</div>
<button class="add" onclick="event.stopPropagation();openAdd('${k}')">＋ ${ms.length?'끼니 추가':'식단 계획'}</button></div>`);
  }
  return out;
}
function mealHTML(m,i,k,first){
  const done=m.status==='done';
  return `<div class="meal ${done?'done':'plan'}" onclick="event.stopPropagation();openAdd('${k}',${i})">
<button class="status" title="완료 상태 전환" onclick="event.stopPropagation();toggleDone('${k}',${i})">${done?'✓':'○'}</button>
<div class="meal-head"><span class="meal-no">${i+1}끼</span><span class="time">${esc(m.time||'')}</span></div>
<div class="base-line">🍚 ${m.bases?.length?esc(m.bases.join(' + ')):'베이스 미정'}</div>
<div class="toppings">${(m.toppings||[]).map(x=>`<span class="chip ${first.has(x)?'first':''}">${emoji(x)} ${esc(x)}${first.has(x)?' ★':''}</span>`).join('')||'<span class="empty-meal">토핑 미정</span>'}</div></div>`;
}
function selectDay(k){selectedKey=k;openDay(k)}
function moveMonth(n){view.setMonth(view.getMonth()+n);render()}
function goToday(){view=new Date();view.setDate(1);selectedKey=todayKey();render()}
function toggleDone(k,i){const a=meals(k).slice();if(!a[i])return;a[i]={...a[i],status:a[i].status==='done'?'plan':'done'};setMeals(k,a);render();queueDaySync(k)}
function openAdd(k=todayKey(),idx=-1){
  selectedKey=k;const a=meals(k),m=idx>=0?a[idx]:{bases:[],toppings:[],time:'',memo:'',status:'plan'};
  window.fb=[...(m.bases||[])];window.ft=[...(m.toppings||[])];
  openSheet(`<div class="sheet-head"><div><h2>${idx>=0?`${idx+1}끼 식단 수정`:`${a.length+1}끼 식단 추가`}</h2><div class="small">${k} · D+${dplus(k)}</div></div><button class="close" onclick="closeSheet()">×</button></div>
<div class="section"><div class="label">상태</div><div class="plan-toggle"><button class="toggle ${m.status==='plan'?'on':''}" onclick="setStatus(this,'plan')">◯ 먹일 예정</button><button class="toggle ${m.status==='done'?'on':''}" onclick="setStatus(this,'done')">✓ 먹었어요</button></div></div>
<div class="section"><div class="label">베이스 · 여러 개 선택 가능</div><div class="opts">${state.bases.map(x=>`<button class="opt ${window.fb.includes(x)?'on':''}" onclick="toggleFood(this,'b','${esc(x)}')">🍚 ${esc(x)}</button>`).join('')}</div></div>
<div class="section"><div class="label">토핑 · 여러 개 선택 가능</div><div class="opts">${state.toppings.map(x=>`<button class="opt ${window.ft.includes(x)?'on':''}" onclick="toggleFood(this,'t','${esc(x)}')">${emoji(x)} ${esc(x)}</button>`).join('')}</div></div>
<div class="section"><div class="label">시간</div><input id="mealTime" class="input" value="${esc(m.time||'')}" placeholder="예: 오전 10:30"></div>
<div class="section"><div class="label">메모</div><textarea id="memo" class="input" rows="3" placeholder="미리 먹일 식단이나 실제 반응을 기록">${esc(m.memo||'')}</textarea></div>
<button class="save" onclick="saveMeal('${k}',${idx})">저장하기</button>${idx>=0?`<button type="button" class="save danger" onclick="deleteMeal('${k}',${idx})">이 끼니 삭제</button>`:''}`);
  window.fstatus=m.status||'plan';
}
function setStatus(el,v){window.fstatus=v;el.parentElement.querySelectorAll('.toggle').forEach(x=>x.classList.remove('on'));el.classList.add('on')}
function toggleFood(el,type,x){const a=type==='b'?window.fb:window.ft,i=a.indexOf(x);if(i>=0){a.splice(i,1);el.classList.remove('on')}else{a.push(x);el.classList.add('on')}}
function saveMeal(k,idx){
  const a=meals(k).slice(),m={bases:[...window.fb],toppings:[...window.ft],time:document.getElementById('mealTime').value,memo:document.getElementById('memo').value,status:window.fstatus||'plan'};
  if(idx>=0)a[idx]={...a[idx],...m};else a.push(m);
  setMeals(k,a);closeSheet();render();queueDaySync(k);
}
async function deleteMeal(k,idx){
  const a=meals(k).slice();if(idx<0||idx>=a.length)return;
  const removed=a[idx];a.splice(idx,1);setMeals(k,a);closeSheet();render();
  try{
    if(cloudReady&&removed.id){const {error}=await supabaseClient.from('meals').delete().eq('id',removed.id);if(error)throw error}
    await queueDaySync(k);
  }catch(e){console.error(e);alert('삭제한 끼니를 서버에 반영하지 못했어요. 다시 시도해주세요.')}
}
function openDay(k){
  const a=meals(k);
  openSheet(`<div class="sheet-head"><div><h2>${k} · D+${dplus(k)}</h2><div class="small">${a.length?'등록된 끼니 '+a.length+'개':'아직 식단이 없어요'}</div></div><button class="close" onclick="closeSheet()">×</button></div>
${a.map((m,i)=>`<div class="row"><span><b>${i+1}끼</b> · ${m.status==='done'?'먹음':'먹을 예정'}<br><span class="small">🍚 ${(m.bases||[]).join(' + ')||'베이스 미정'} · ${(m.toppings||[]).join(' · ')||'토핑 미정'}</span></span><button class="icon" onclick="openAdd('${k}',${i})">수정</button></div>`).join('')}
<button class="save" style="margin-top:10px" onclick="openAdd('${k}')">＋ 이 날짜에 끼니 추가</button>`);
}
function openSheet(x){document.getElementById('sheet').innerHTML=x;document.getElementById('overlay').classList.add('show')}
function closeSheet(){document.getElementById('overlay').classList.remove('show')}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet()})

function openBabies(){
  openSheet(`<div class="sheet-head"><h2>👶 아기 선택</h2><button class="close" onclick="closeSheet()">×</button></div>
${state.babies.map(b=>`<div class="row"><button type="button" style="border:0;background:none;text-align:left;flex:1;padding:0" onclick="switchBaby('${b.id}')"><b>${esc(b.name)}</b><br><span class="small">${b.birth}</span></button><span>${b.id===state.activeBaby?'✓':''}</span><button type="button" class="icon" onclick="editBaby('${b.id}')">✏️</button></div>`).join('')}
<div class="section"><div class="label">아기 추가</div><input id="bn" class="input" placeholder="이름"><input id="bb" type="date" class="input" style="margin-top:7px"><button type="button" class="save" style="margin-top:8px" onclick="addBaby()">추가</button></div>`);
}
function editBaby(id){
  const b=state.babies.find(x=>x.id===id);if(!b)return;
  openSheet(`<div class="sheet-head"><h2>👶 아기 정보 수정</h2><button class="close" onclick="openBabies()">×</button></div>
<div class="section"><div class="label">아기 이름</div><input id="editName" class="input" value="${esc(b.name)}"></div>
<div class="section"><div class="label">생년월일</div><input id="editBirth" type="date" class="input" value="${esc(b.birth||'')}"></div>
<button type="button" class="save" onclick="saveBaby('${id}')">저장하기</button><button type="button" class="save secondary" onclick="openBabies()">취소</button>`);
}
function saveBaby(id){
  const b=state.babies.find(x=>x.id===id);if(!b)return;
  const name=document.getElementById('editName').value.trim(),birth=document.getElementById('editBirth').value;
  if(!name||!birth)return alert('아기 이름과 생년월일을 모두 입력해주세요.');
  b.name=name;b.birth=birth;state.activeBaby=id;save();closeSheet();render();syncBabyToCloud(b);
}
function switchBaby(id){state.activeBaby=id;save();closeSheet();render()}
function addBaby(){
  const n=document.getElementById('bn').value.trim(),b=document.getElementById('bb').value;
  if(!n||!b)return alert('이름과 생년월일을 입력해주세요.');
  state.babies.push({id:'b'+Date.now(),name:n,birth:b});state.activeBaby=state.babies.at(-1).id;save();closeSheet();render();syncBabyToCloud(state.babies.at(-1));
}
function openSettings(){
  openSheet(`<div class="sheet-head"><div><h2>⚙️ 설정</h2><div class="small">${esc(authUser?.email||'')}</div></div><button class="close" onclick="closeSheet()">×</button></div>
<div class="section"><div class="label">아기 정보</div><button type="button" class="save" onclick="openBabies()">이름 / 생년월일 수정</button></div>
<div class="section"><div class="label">식재료 관리</div><button type="button" class="save" onclick="openIngredients()">베이스 / 토핑 관리</button></div>
<div class="section"><div class="label">데이터</div><button type="button" class="save" onclick="backup()">백업 파일 저장</button><button type="button" class="save secondary" onclick="restore()">백업 불러오기</button></div>
<div class="section"><button type="button" class="save danger" onclick="logout()">로그아웃</button></div>`);
}
function openIngredients(){
  openSheet(`<div class="sheet-head"><h2>🥕 식재료 관리</h2><button class="close" onclick="closeSheet()">×</button></div>
<div class="section"><div class="label">베이스</div><div class="list">${state.bases.map((x,i)=>`<div class="row"><b>🍚 ${esc(x)}</b><button type="button" class="icon" onclick="removeIng('bases',${i})">삭제</button></div>`).join('')}</div><div style="display:flex;gap:7px;margin-top:8px"><input id="nb" class="input" placeholder="베이스 추가"><button class="icon" onclick="addIng('bases')">＋</button></div></div>
<div class="section"><div class="label">토핑</div><div class="list">${state.toppings.map((x,i)=>`<div class="row"><b>${emoji(x)} ${esc(x)}</b><button type="button" class="icon" onclick="removeIng('toppings',${i})">삭제</button></div>`).join('')}</div><div style="display:flex;gap:7px;margin-top:8px"><input id="nt" class="input" placeholder="토핑 추가"><button class="icon" onclick="addIng('toppings')">＋</button></div></div>`);
}
function addIng(t){const id=t==='bases'?'nb':'nt',v=document.getElementById(id).value.trim();if(v&&!state[t].includes(v)){state[t].push(v);save();openIngredients();render();syncFoodsToCloud()}}
function removeIng(t,i){if(i<0||i>=state[t].length)return;state[t].splice(i,1);save();openIngredients();render();syncFoodsToCloud()}
function backup(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`이유식-식단백업-${todayKey()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function restore(){const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();closeSheet();render();queueCloudSync();alert('복원했어요.')}catch(x){alert('올바른 백업 파일이 아니에요.')}};r.readAsText(f)};input.click()}

async function signIn(email,password){
  if(!supabaseClient)return authMessage('Supabase 연결 설정을 먼저 완료해주세요.','error');
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error)authMessage(error.message,'error');
}
async function signUp(email,password,babyName,birth){
  if(!supabaseClient)return authMessage('Supabase 연결 설정을 먼저 완료해주세요.','error');
  if(!email||!password||!babyName||!birth)return authMessage('이메일, 비밀번호, 아기 이름, 생년월일을 모두 입력해주세요.','error');
  if(password.length<6)return authMessage('비밀번호는 6자 이상으로 입력해주세요.','error');
  localStorage.setItem('yummy_pending_signup',JSON.stringify({babyName,birth}));
  const opts={data:{baby_name:babyName,birth_date:birth}};
  const redirect=getRedirectUrl();if(redirect)opts.emailRedirectTo=redirect;
  const {data,error}=await supabaseClient.auth.signUp({email,password,options:opts});
  if(error){authMessage(error.message,'error');return}
  if(data.session)await onSignedIn(data.session.user);
  else authMessage('가입 요청이 완료됐어요. 이메일 인증이 켜져 있다면 인증 후 로그인해주세요.','success');
}
async function resetPassword(email){
  if(!email)return authMessage('비밀번호를 재설정할 이메일을 입력해주세요.','error');
  const redirect=getRedirectUrl();
  const {error}=await supabaseClient.auth.resetPasswordForEmail(email,redirect?{redirectTo:redirect}:{});
  if(error)authMessage(error.message,'error');else authMessage('비밀번호 재설정 메일을 보냈어요.','success');
}
async function logout(){await supabaseClient.auth.signOut();closeSheet()}
function authMessage(msg,type='info'){const el=document.getElementById('authMsg');if(el){el.className='auth-msg '+(type==='error'?'auth-error':type==='success'?'auth-success':'');el.textContent=msg;el.hidden=false}}
function authTab(mode){document.getElementById('authMode').value=mode;document.querySelectorAll('.auth-tab').forEach(x=>x.classList.toggle('on',x.dataset.mode===mode));const signup=mode==='signup';document.getElementById('signupFields').hidden=!signup;document.getElementById('authSubmit').textContent=signup?'회원가입':'로그인';document.getElementById('forgotBtn').hidden=signup;document.getElementById('authMsg').hidden=true}
function renderAuth(){
  const c=getConfig();
  document.getElementById('app').innerHTML=`<main class="auth-screen"><section class="auth-card"><div class="auth-logo">👶</div><div class="auth-title">냠냠 식단</div><div class="auth-sub">냠냠쩝쩝 맛있게 먹어보자 🥣</div>
${isConfigured()?`<div class="auth-tabs"><button type="button" class="auth-tab on" data-mode="signin" onclick="authTab('signin')">로그인</button><button type="button" class="auth-tab" data-mode="signup" onclick="authTab('signup')">회원가입</button></div>
<input id="authMode" type="hidden" value="signin"><div id="authMsg" class="auth-msg" hidden></div><form class="auth-form" onsubmit="event.preventDefault();submitAuth()"><input id="authEmail" class="input" type="email" autocomplete="email" placeholder="이메일" required><input id="authPassword" class="input" type="password" autocomplete="current-password" placeholder="비밀번호" required>
<div id="signupFields" hidden><input id="authBabyName" class="input" style="margin-top:0" placeholder="아기 이름"><input id="authBirth" class="input" style="margin-top:9px" type="date"></div>
<div class="auth-actions"><button id="authSubmit" class="save" type="submit">로그인</button><button id="forgotBtn" type="button" class="auth-link" onclick="resetPassword(document.getElementById('authEmail').value)">비밀번호를 잊으셨나요?</button></div></form>`:
`<div class="auth-msg">처음 한 번만 Supabase 연결 정보를 넣어주세요. Publishable key는 브라우저에서 사용하는 공개 키입니다. <b>Secret key는 넣으면 안 돼요.</b></div><form class="auth-form" onsubmit="event.preventDefault();saveConfigFromForm()"><input id="cfgUrl" class="input" value="${esc(c.url)}" placeholder="Project URL"><input id="cfgKey" class="input" type="password" placeholder="Publishable key (sb_publishable_...)"><button class="save" type="submit">Supabase 연결하기</button></form><div class="config-note">연결 정보는 이 기기의 브라우저에만 저장됩니다.</div>`}</section></main>`;
}
async function submitAuth(){const mode=document.getElementById('authMode').value,email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;if(mode==='signup')return signUp(email,password,document.getElementById('authBabyName').value.trim(),document.getElementById('authBirth').value);return signIn(email,password)}
function saveConfigFromForm(){const url=document.getElementById('cfgUrl').value.trim().replace(/\/$/,''),key=document.getElementById('cfgKey').value.trim();if(!/^https:\/\//.test(url)||!key.startsWith('sb_publishable_')){alert('Project URL과 sb_publishable_로 시작하는 Publishable key를 확인해주세요.');return}localStorage.setItem(CONFIG_KEY,JSON.stringify({url,key}));location.reload()}

function makeStateFromCloud(babies,foods,mealsCloud,links){
  const foodMap={};foods.forEach(f=>foodMap[f.id]=f);
  const mealLinks={};links.forEach(l=>(mealLinks[l.meal_id]??=[]).push(foodMap[l.food_id]));
  const plans={};
  mealsCloud.forEach(m=>{
    const key=`${m.baby_id}_${m.meal_date}`,linked=mealLinks[m.id]||[];
    const meal={id:m.id,bases:linked.filter(f=>f?.type==='base').map(f=>f.name),toppings:linked.filter(f=>f?.type==='topping').map(f=>f.name),time:m.meal_time||'',memo:m.memo||'',status:m.status||'plan'};
    (plans[key]??=[]).push(meal);
  });
  Object.keys(plans).forEach(k=>plans[k].sort((a,b)=>(a.meal_number||0)-(b.meal_number||0)));
  return {babies:babies.map(b=>({id:b.id,name:b.name,birth:b.birth_date})),activeBaby:state.babies.find(x=>babies.some(b=>b.id===x.id))?.id||babies[0]?.id,bases:foods.filter(f=>f.type==='base').map(f=>f.name),toppings:foods.filter(f=>f.type==='topping').map(f=>f.name),plans};
}
async function loadCloudState(){
  const [bRes,fRes,mRes,mfRes]=await Promise.all([
    supabaseClient.from('babies').select('*').order('created_at'),
    supabaseClient.from('foods').select('*').order('created_at'),
    supabaseClient.from('meals').select('*').order('meal_date').order('meal_number'),
    supabaseClient.from('meal_foods').select('meal_id,food_id')
  ]);
  for(const r of [bRes,fRes,mRes,mfRes])if(r.error)throw r.error;
  let babies=bRes.data||[],foods=fRes.data||[],mealsCloud=mRes.data||[],links=mfRes.data||[];
  if(!babies.length){
    const pending=JSON.parse(localStorage.getItem('yummy_pending_signup')||'null');
    if(pending){
      const {data,error}=await supabaseClient.from('babies').insert({user_id:authUser.id,name:pending.babyName,birth_date:pending.birth}).select().single();
      if(error)throw error;
      babies=[data];
      localStorage.removeItem('yummy_pending_signup');
    }else{
      const {data,error}=await supabaseClient.from('babies').insert({user_id:authUser.id,name:'우리 아기',birth_date:'2026-04-01'}).select().single();
      if(error)throw error;
      babies=[data];
    }
  }
  if(!foods.length){
    const rows=[...defaultState.bases.map(name=>({user_id:authUser.id,name,type:'base'})),...defaultState.toppings.map(name=>({user_id:authUser.id,name,type:'topping'}))];
    const {data,error}=await supabaseClient.from('foods').upsert(rows,{onConflict:'user_id,type,name'}).select();
    if(error)throw error;foods=data||[];
  }
  state=makeStateFromCloud(babies,foods,mealsCloud,links);
  localStorage.setItem(KEY,JSON.stringify(state));
}
async function syncBabyToCloud(b){
  if(!cloudReady||!authUser)return;
  if(!isUUID(b.id))return;
  const {error}=await supabaseClient.from('babies').update({name:b.name,birth_date:b.birth}).eq('id',b.id);
  if(error)showCloudError(error);
}
function isUUID(x){return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(x||'')}
async function syncFoodsToCloud(){
  if(!cloudReady||!authUser)return;
  try{
    const rows=[...new Set(state.bases)].map(name=>({user_id:authUser.id,name,type:'base'})).concat([...new Set(state.toppings)].map(name=>({user_id:authUser.id,name,type:'topping'})));
    if(rows.length){const {error}=await supabaseClient.from('foods').upsert(rows,{onConflict:'user_id,type,name'});if(error)throw error}
  }catch(e){showCloudError(e)}
}
async function syncDayToCloud(date){
  if(!cloudReady||!authUser||loadingCloud)return;
  try{
    await syncFoodsToCloud();
    const babyId=state.activeBaby;
    if(!isUUID(babyId))return;
    const dayMeals=meals(date);
    const rows=dayMeals.map((m,i)=>({id:isUUID(m.id)?m.id:undefined,baby_id:babyId,meal_date:date,meal_number:i+1,status:m.status||'plan',meal_time:m.time||null,memo:m.memo||null}));
    const payload=rows.map(r=>{const x={baby_id:r.baby_id,meal_date:r.meal_date,meal_number:r.meal_number,status:r.status,meal_time:r.meal_time,memo:r.memo};if(r.id)x.id=r.id;return x});
    let saved=[];
    if(payload.length){
      const {data,error}=await supabaseClient.from('meals').upsert(payload,{onConflict:'baby_id,meal_date,meal_number'}).select();
      if(error)throw error;saved=data||[];
    }
    const {data:existing,error:ee}=await supabaseClient.from('meals').select('id,meal_number').eq('baby_id',babyId).eq('meal_date',date);
    if(ee)throw ee;
    const wanted=new Set(payload.map(x=>x.meal_number));
    const remove=(existing||[]).filter(x=>!wanted.has(x.meal_number)).map(x=>x.id);
    if(remove.length){const {error}=await supabaseClient.from('meals').delete().in('id',remove);if(error)throw error}
    const savedByNo={};saved.forEach(m=>savedByNo[m.meal_number]=m);
    const foodRows=[...new Set(state.bases)].map(name=>({user_id:authUser.id,name,type:'base'})).concat([...new Set(state.toppings)].map(name=>({user_id:authUser.id,name,type:'topping'})));
    const {data:foods,error:fe}=await supabaseClient.from('foods').upsert(foodRows,{onConflict:'user_id,type,name'}).select();
    if(fe)throw fe;
    const foodId={};(foods||[]).forEach(f=>foodId[`${f.type}|${f.name}`]=f.id);
    const mealIds=Object.values(savedByNo).map(x=>x.id);
    if(mealIds.length){const {error}=await supabaseClient.from('meal_foods').delete().in('meal_id',mealIds);if(error)throw error}
    const links=[];
    dayMeals.forEach((m,i)=>{
      const mid=savedByNo[i+1]?.id||m.id;
      if(!mid)return;
      (m.bases||[]).forEach(n=>{const fid=foodId[`base|${n}`];if(fid)links.push({meal_id:mid,food_id:fid})});
      (m.toppings||[]).forEach(n=>{const fid=foodId[`topping|${n}`];if(fid)links.push({meal_id:mid,food_id:fid})});
      if(!m.id&&savedByNo[i+1])m.id=savedByNo[i+1].id;
    });
    if(links.length){const {error}=await supabaseClient.from('meal_foods').insert(links);if(error)throw error}
    localStorage.setItem(KEY,JSON.stringify(state));
  }catch(e){showCloudError(e)}
}
function showCloudError(e){console.error('Supabase:',e);const msg=e?.message||'클라우드 저장에 실패했어요.';const el=document.getElementById('authMsg');if(el)authMessage(msg,'error');else console.error(msg)}
function queueDaySync(date){
  if(!cloudReady||!authUser||loadingCloud)return cloudSyncQueue;
  cloudSyncQueue=cloudSyncQueue.then(()=>syncDayToCloud(date)).catch(e=>{console.error(e)});
  return cloudSyncQueue;
}
function queueCloudSync(){
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer=setTimeout(()=>{
    cloudSyncQueue=cloudSyncQueue.then(()=>syncAllDaysToCloud()).catch(e=>console.error(e));
  },700);
}
async function syncAllDaysToCloud(){
  if(!cloudReady||!authUser||loadingCloud)return;
  const dates=[...new Set(Object.keys(state.plans).filter(k=>k.startsWith(state.activeBaby+'_')).map(k=>k.slice(state.activeBaby.length+1)))];
  for(const d of dates)await syncDayToCloud(d);
  await syncFoodsToCloud();
}
async function onSignedIn(user){
  authUser=user;loadingCloud=true;cloudReady=false;
  document.getElementById('app').innerHTML='<main class="auth-screen"><section class="auth-card"><div class="auth-logo">🥣</div><div class="auth-title">불러오는 중...</div><div class="auth-sub">식단을 안전하게 가져오고 있어요.</div></section></main>';
  try{await loadCloudState();cloudReady=true;loadingCloud=false;render();}catch(e){loadingCloud=false;renderAuth();authMessage(e.message||'데이터를 불러오지 못했어요.','error')}
}
async function initApp(){
  if(!isConfigured()){renderAuth();return}
  initClient();
  supabaseClient.auth.onAuthStateChange(async(event,session)=>{
    if(session?.user&&(event==='INITIAL_SESSION'||event==='SIGNED_IN'||event==='TOKEN_REFRESHED')){
      if(!authUser||authUser.id!==session.user.id)await onSignedIn(session.user)
    }else if(event==='SIGNED_OUT'){authUser=null;cloudReady=false;renderAuth()}
  });
  const {data}=await supabaseClient.auth.getSession();
  if(data.session)await onSignedIn(data.session.user);else renderAuth();
}
initApp();
</script>
